name: Archive old media to Drive

# Downloads Radiocult media older than N weeks, uploads it to Google Drive,
# then commits the updated state files back so reruns stay idempotent.
#
# Google Drive auth uses a stored OAuth refresh token (no gcloud on the runner):
#   GOOGLE_CLIENT_ID / GOOGLE_CLIENT_SECRET / GOOGLE_REFRESH_TOKEN
# generated once locally for eistcork@gmail.com with a Desktop-type client and
# the drive scope. Keep the OAuth consent screen in Production, not Testing,
# or the refresh token expires after 7 days.

on:
  workflow_dispatch:
    inputs:
      mode:
        description: 'What to run'
        type: choice
        default: full
        options:
          - full      # scan + archive + cleanup (state preserved)
          - scan      # list stale media only
          - archive   # download + upload to Drive
          - cleanup   # tag archived media ready_to_delete
      weeks:
        description: 'Age threshold in weeks'
        type: string
        default: '8'
      dry_run:
        description: 'Preview only, change nothing'
        type: boolean
        default: true
      notify:
        description: 'Post the result to the Discord programming channel'
        type: boolean
        default: false
      requested_by:
        description: 'Who asked for this run (set by the /cleanup command)'
        type: string
        default: ''

  # Monthly unattended run. The keepalive workflow stops GitHub disabling this.
  schedule:
    - cron: '23 4 2 * *'  # 2nd of every month at 04:23 UTC

permissions:
  contents: write

concurrency:
  group: archive
  cancel-in-progress: false

jobs:
  archive:
    runs-on: ubuntu-latest
    timeout-minutes: 350  # runner hard ceiling is 6h (360m)

    env:
      API_KEY: ${{ secrets.API_KEY }}
      RADIOCULT_USER: ${{ secrets.RADIOCULT_USER }}
      RADIOCULT_PW: ${{ secrets.RADIOCULT_PW }}
      GOOGLE_CLIENT_ID: ${{ secrets.GOOGLE_CLIENT_ID }}
      GOOGLE_CLIENT_SECRET: ${{ secrets.GOOGLE_CLIENT_SECRET }}
      GOOGLE_REFRESH_TOKEN: ${{ secrets.GOOGLE_REFRESH_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # full history so the state commit can rebase on push

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install Python dependencies
        run: |
          pip install --upgrade pip
          pip install requests python-dotenv playwright

      - name: Install Playwright browsers
        run: |
          playwright install chromium
          playwright install-deps chromium

      - name: Resolve inputs
        id: cfg
        run: |
          # Scheduled runs default to a live full run; dispatch uses the inputs.
          MODE="${{ inputs.mode || 'full' }}"
          WEEKS="${{ inputs.weeks || '8' }}"
          DRY="${{ inputs.dry_run }}"
          if [ "${{ github.event_name }}" = "schedule" ]; then
            MODE="full"
            DRY="true"   # monthly run previews only; the keepalive step below warms the token
          fi
          case "$MODE" in
            # Pass all three flags explicitly. The no-flag path wipes
            # archive-state.json first, which would break commit-back idempotency.
            full)    FLAGS="--scan --archive --cleanup" ;;
            scan)    FLAGS="--scan" ;;
            archive) FLAGS="--archive" ;;
            cleanup) FLAGS="--cleanup" ;;
          esac
          [ "$DRY" = "true" ] && FLAGS="$FLAGS --dry-run"
          echo "flags=$FLAGS --weeks $WEEKS" >> "$GITHUB_OUTPUT"
          echo "dry=$DRY" >> "$GITHUB_OUTPUT"
          echo "Mode=$MODE  Weeks=$WEEKS  DryRun=$DRY" >> "$GITHUB_STEP_SUMMARY"

      - name: Run archive manager
        id: run
        run: |
          echo "Free disk before run:"; df -h / | tail -1
          set -o pipefail
          python scripts/eist-archive-manager.py ${{ steps.cfg.outputs.flags }} \
            2>&1 | tee run-output.log
          echo "Free disk after run:"; df -h / | tail -1

      - name: Extract counts
        id: counts
        if: always()
        run: |
          # mode_archive prints "Archived X/Y items"; mode_cleanup prints
          # "Tagged X/Y tracks as ready_to_delete". Absent lines report as 0.
          ARCHIVED=$(grep -oP '^Archived \K[0-9]+' run-output.log | tail -1)
          TAGGED=$(grep -oP '^Tagged \K[0-9]+' run-output.log | tail -1)
          echo "archived=${ARCHIVED:-0}" >> "$GITHUB_OUTPUT"
          echo "tagged=${TAGGED:-0}" >> "$GITHUB_OUTPUT"

      - name: Keep Drive token warm
        if: always()
        run: |
          # Exchanging the refresh token resets Google's 6-month idle clock, so
          # even a dry-run monthly keeps the credential alive. Doubles as a health
          # check: a non-200 here warns before the token silently lapses.
          HTTP=$(curl -s -o /dev/null -w '%{http_code}' \
            -d client_id="$GOOGLE_CLIENT_ID" \
            -d client_secret="$GOOGLE_CLIENT_SECRET" \
            -d refresh_token="$GOOGLE_REFRESH_TOKEN" \
            -d grant_type=refresh_token \
            https://oauth2.googleapis.com/token)
          if [ "$HTTP" = "200" ]; then
            echo "Drive refresh token OK (200)."
          else
            echo "::warning::Drive token refresh returned $HTTP"
          fi

      - name: Report success to Discord
        if: success() && inputs.notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_PROGRAMMING_WEBHOOK || secrets.DISCORD_WEBHOOK }}
          ARCHIVED: ${{ steps.counts.outputs.archived }}
          TAGGED: ${{ steps.counts.outputs.tagged }}
          REQUESTED_BY: ${{ inputs.requested_by }}
        run: |
          if [ -z "$WEBHOOK" ]; then
            echo "::warning::No Discord webhook configured."
            exit 0
          fi
          BY=""
          [ -n "$REQUESTED_BY" ] && BY=" (requested by $REQUESTED_BY)"
          # jq builds the JSON so nothing needs hand-escaping.
          jq -n \
            --arg desc "Cleanup finished${BY}."$'\n'"**${ARCHIVED}** files archived to Drive."$'\n'"${TAGGED} tagged ready_to_delete." \
            '{embeds: [{description: $desc, color: 3066993}]}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"

      - name: Report failure to Discord
        if: failure() && inputs.notify
        env:
          WEBHOOK: ${{ secrets.DISCORD_PROGRAMMING_WEBHOOK || secrets.DISCORD_WEBHOOK }}
        run: |
          [ -z "$WEBHOOK" ] && exit 0
          # Double backslash so Discord markdown renders one.
          jq -n --arg desc 'oops that didn'"'"'t work ¯\\_(ツ)_/¯' \
            '{embeds: [{description: $desc, color: 15158332}]}' \
            | curl -sf -H "Content-Type: application/json" -d @- "$WEBHOOK"

      - name: Commit state back
        if: always() && steps.cfg.outputs.dry != 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # State files are gitignored (*.json), so force-add them.
          git add -f archive-state.json archive-scan.json 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "No state changes to commit."
          else
            git commit -m "chore: update archive state [skip ci]"
            # Remote main may have advanced (a direct push or another run) since
            # checkout, so rebase our state commit on top and retry the push.
            for attempt in 1 2 3 4 5; do
              if git push; then
                echo "Pushed state on attempt $attempt."
                break
              fi
              echo "Push rejected (attempt $attempt), rebasing on origin/main..."
              git pull --rebase --autostash origin main
              if [ "$attempt" = "5" ]; then
                echo "::error::Could not push archive state after 5 attempts."
                exit 1
              fi
            done
          fi

      - name: Upload error screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: archive-errors-${{ github.run_number }}
          path: |
            error_screenshot_*.png
            error-screenshot.png
          retention-days: 7
          if-no-files-found: ignore
